<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080808" />
    <title>Tanashri — A Story</title>
    <meta name="description" content="A personal cinematic interactive story for Tanashri." />

    <!-- Google Fonts Preconnect & Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#080808] text-[#F5F2EC] selection:bg-[#581825] selection:text-[#F5F2EC] antialiased overflow-x-hidden">
    <!-- Instant Preloaded Soundtrack for Zero-Latency Playback -->
    <audio id="global-bg-audio" src="/audio/00_intro.mp3" preload="auto" loop playsinline></audio>
    <script>
      (function() {
        var audio = document.getElementById('global-bg-audio');
        if (!audio) return;
        audio.volume = 0.55;
        audio.muted = false;

        function startAudio() {
          audio.muted = false;
          audio.volume = 0.55;
          var p = audio.play();
          if (p !== undefined) {
            p.then(function() {
              cleanup();
            }).catch(function() {});
          }
        }

        function cleanup() {
          ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown', 'scroll'].forEach(function(e) {
            window.removeEventListener(e, startAudio, true);
            document.removeEventListener(e, startAudio, true);
          });
        }

        // 1. Try immediate unmuted autoplay on load
        startAudio();

        // 2. Unblock immediately on first touch anywhere on screen
        ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown', 'scroll'].forEach(function(e) {
          window.addEventListener(e, startAudio, { capture: true, passive: true });
          document.addEventListener(e, startAudio, { capture: true, passive: true });
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
